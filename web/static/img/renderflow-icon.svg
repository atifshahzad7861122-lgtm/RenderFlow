<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="rfGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="rfGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.95)" />
      <stop offset="100%" stop-color="rgba(30, 41, 59, 0.85)" />
    </linearGradient>
    <filter id="rfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#00f0ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Protective Frame -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#rfGradDark)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" />

  <!-- Flow Chevron Ribbon (R & Velocity) -->
  <path d="M13 29 C13 19, 20 13, 28 13 C34 13, 37 16, 37 20 C37 24, 33 27, 27 27 L17 27" 
        stroke="url(#rfGradAccent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#rfShadow)" />
  <path d="M22 27 L31 37" 
        stroke="url(#rfGradAccent)" stroke-width="3.2" stroke-linecap="round" />

  <!-- Cinematic Play/Render Core Prism -->
  <polygon points="22.5,18 31,23 22.5,28" fill="#ffffff" opacity="0.95" />

  <!-- Nodes -->
  <circle cx="13" cy="29" r="1.6" fill="#00f0ff" />
  <circle cx="31" cy="37" r="1.6" fill="#38bdf8" />
</svg>